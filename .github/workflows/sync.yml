name: Config Update

on:
  push:
    branches:
      - main
    paths:
      - 'main.py'
      - 'links.txt'
      - '.github/workflows/sync.yml'

  workflow_dispatch:

  schedule:
    - cron: '0 20 * * *'
      timezone: 'Asia/Shanghai'

permissions:
  contents: write

concurrency:
  group: sing-box-rule-sync
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup sing-box
        env:
          SING_BOX_VERSION: "1.13.18"
        run: |
          set -Eeuo pipefail

          SING_BOX_DEB_URL="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box_${SING_BOX_VERSION}_linux_amd64.deb"

          echo "Installing sing-box ${SING_BOX_VERSION}..."

          curl -fL --retry 3 \
            --retry-delay 2 \
            -o sing-box.deb \
            "$SING_BOX_DEB_URL"

          sudo apt-get install -y ./sing-box.deb

          echo "Installed sing-box version:"
          sing-box version

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pyyaml

      - name: Generate rule sets
        working-directory: ./rule
        run: python ../main.py

      - name: Commit updated rules
        run: |
          set -Eeuo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- rule/

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update rules"
          git push
